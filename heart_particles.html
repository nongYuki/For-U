<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For U❤️</title>
<style>
  html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000}
  canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas=document.getElementById("c"), ctx=canvas.getContext("2d");
let W,H,DPR,pts=[],theta=0;
const TAU=Math.PI*2;

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  ctx.setTransform(DPR,0,0,DPR,0,0);
  makePoints();
}
function heart(t){
  return {
    x:16*Math.sin(t)**3,
    y:-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))
  };
}
function makePoints(){
  pts=[];
  const n=Math.min(1700,Math.max(700,Math.floor(W*H/700)));
  for(let i=0;i<n;i++){
    const t=Math.random()*TAU, h=heart(t);
    const r=Math.sqrt(Math.random());
    pts.push({
      x:h.x*r + (Math.random()-.5)*.9,
      y:h.y*r + (Math.random()-.5)*.9,
      z:Math.random()*2-1,
      s:1+Math.random()*2.2,
      a:.35+Math.random()*.65
    });
  }
}
function draw(){
  ctx.clearRect(0,0,W,H);
  const scale=Math.min(W,H)/31;
  const cx=W/2, cy=H/2+scale*.15;
  const ct=Math.cos(theta), st=Math.sin(theta);

  pts.sort((a,b)=>a.z-b.z);
  for(const p of pts){
    // gentle 3D rotation
    const xr=p.x*ct+p.z*4*st;
    const zr=-p.x*st+p.z*4*ct;
    const yr=p.y;
    const perspective=1/(1+zr/90);
    const x=cx+xr*scale*.92*perspective;
    const y=cy+yr*scale*.92*perspective;
    const size=Math.max(.7,p.s*perspective);
    ctx.globalAlpha=p.a;
    ctx.fillStyle=`rgb(255,${25+Math.floor(Math.random()*30)},${35+Math.floor(Math.random()*35)})`;
    ctx.beginPath(); ctx.arc(x,y,size,0,TAU); ctx.fill();
  }
  ctx.globalAlpha=1;
  theta+=.008;
  requestAnimationFrame(draw);
}
addEventListener("resize",resize);
resize(); draw();
</script>
</body>
</html>
