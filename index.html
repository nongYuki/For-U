<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">

<title>For u i auan❤️</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#000;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

/* =========================
   หน้ากล่อง
========================= */

.gift-screen{
    position:fixed;
    inset:0;
    z-index:10;

    display:flex;
    justify-content:center;
    align-items:center;

    background:#000;

    transition:
        opacity 1s ease,
        transform 1s ease;
}

.gift-screen.hide{
    opacity:0;
    transform:scale(1.25);
    pointer-events:none;
}

.gift{
    position:relative;
    width:220px;
    height:200px;

    cursor:pointer;

    filter:
        drop-shadow(0 18px 30px rgba(255,0,0,.25));

    transition:transform .25s ease;
}

.gift:hover{
    transform:scale(1.05);
}


/* =========================
   ตัวกล่องสีขาว
========================= */

.box{
    position:absolute;

    left:15px;
    bottom:10px;

    width:190px;
    height:125px;

    border-radius:4px;

    background:
        linear-gradient(
            90deg,
            #dcdcdc 0%,
            #ffffff 35%,
            #f8f8f8 70%,
            #d8d8d8 100%
        );

    box-shadow:
        inset -12px 0 18px rgba(0,0,0,.12),
        inset 12px 0 18px rgba(255,255,255,.8),
        0 15px 30px rgba(0,0,0,.55);
}


/* =========================
   ริบบิ้นแดงแนวตั้ง
========================= */

.box::before{
    content:"";

    position:absolute;

    left:77px;
    top:0;

    width:36px;
    height:100%;

    background:
        linear-gradient(
            90deg,
            #a50012,
            #ff2038,
            #c90018
        );

    box-shadow:
        0 0 8px rgba(255,0,30,.25);
}


/* =========================
   ฝากล่องสีขาว
========================= */

.lid{
    position:absolute;

    left:0;
    top:43px;

    width:220px;
    height:43px;

    z-index:3;

    border-radius:7px;

    background:
        linear-gradient(
            90deg,
            #d7d7d7,
            #ffffff 40%,
            #f5f5f5 70%,
            #d5d5d5
        );

    box-shadow:
        0 7px 12px rgba(0,0,0,.45);

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}


/* ริบบิ้นแดงบนฝากล่อง */

.lid::before{
    content:"";

    position:absolute;

    left:92px;
    top:0;

    width:36px;
    height:43px;

    background:
        linear-gradient(
            90deg,
            #a50012,
            #ff2038,
            #c90018
        );
}


/* =========================
   โบว์สีแดง
========================= */

.bow{
    position:absolute;

    z-index:5;

    left:110px;
    top:17px;

    width:30px;
    height:30px;

    transform:translateX(-50%);

    background:
        radial-gradient(
            circle,
            #ff4050,
            #c90018
        );

    border-radius:50%;

    box-shadow:
        0 3px 8px rgba(0,0,0,.3);

    transition:
        transform 1s cubic-bezier(.2,.8,.2,1);
}

.bow::before,
.bow::after{
    content:"";

    position:absolute;

    top:-9px;

    width:67px;
    height:43px;

    background:
        linear-gradient(
            135deg,
            #ff3448,
            #b80015
        );

    box-shadow:
        0 3px 7px rgba(0,0,0,.25);

    border-radius:
        60% 60% 20% 60%;
}

.bow::before{
    right:8px;
    transform:rotate(25deg);
}

.bow::after{
    left:8px;

    transform:
        scaleX(-1)
        rotate(25deg);
}


/* =========================
   เปิดกล่อง
========================= */

.gift.open .lid{
    transform:
        translateY(-95px)
        rotate(-8deg);
}

.gift.open .bow{
    transform:
        translate(-50%,-95px)
        rotate(-8deg);
}

.gift.open{
    animation:
        shake .45s ease;
}

@keyframes shake{

    0%,100%{
        transform:scale(1);
    }

    25%{
        transform:
            scale(1.05)
            rotate(-2deg);
    }

    50%{
        transform:
            scale(1.08)
            rotate(2deg);
    }

    75%{
        transform:
            scale(1.05)
            rotate(-1deg);
    }
}


/* =========================
   หัวใจ 3D
========================= */

#heart{
    opacity:0;

    transform:
        translateY(180px)
        scale(.15);

    transition:
        opacity .8s ease,
        transform 1.2s cubic-bezier(.15,.8,.2,1);
}

#heart.show{
    opacity:1;

    transform:
        translateY(0)
        scale(1);
}
</style>
</head>

<body>

<!-- กล่อง -->

<div class="gift-screen" id="giftScreen">

    <div class="gift" id="gift">

        <div class="bow"></div>

        <div class="lid"></div>

        <div class="box"></div>

    </div>

</div>


<!-- หัวใจ -->

<canvas id="heart"></canvas>


<script>

/* =========================
   หัวใจ 3D
========================= */

const c=document.getElementById("heart");
const x=c.getContext("2d");

let w,h,d;
let points=[];
let rot=0;
let target=0;

const TAU=Math.PI*2;


/* Resize */

function resize(){

    d=Math.min(
        devicePixelRatio||1,
        2
    );

    w=innerWidth;
    h=innerHeight;

    c.width=w*d;
    c.height=h*d;

    x.setTransform(
        d,0,0,d,0,0
    );

    build();
}


/* รูปหัวใจ */

function H(t){

    return [

        16*Math.sin(t)**3,

        -(
            13*Math.cos(t)
            -5*Math.cos(2*t)
            -2*Math.cos(3*t)
            -Math.cos(4*t)
        )

    ];
}


/* สร้างจุดหัวใจ */

function build(){

    points=[];

    const n=Math.max(
        1100,
        Math.min(
            2800,
            Math.floor(w*h/380)
        )
    );

    for(let i=0;i<n;i++){

        const t=
            Math.random()*TAU;

        const q=H(t);

        const r=
            Math.sqrt(
                Math.random()
            );

        const z=
            (Math.random()*2-1)
            *4.2
            *Math.sqrt(1-r*r);

        points.push({

            x:
                q[0]*r+
                (Math.random()-.5)*.75,

            y:
                q[1]*r+
                (Math.random()-.5)*.75,

            z:z,

            size:
                .7+
                Math.random()*2.2,

            alpha:
                .35+
                Math.random()*.65,

            tw:
                Math.random()*TAU
        });
    }
}


/* Animation */

function frame(time){

    x.clearRect(
        0,0,w,h
    );

    rot+=(target-rot)*.025;

    const sc=
        Math.min(w,h)/30.5;

    const cx=w/2;
    const cy=h/2;

    const co=Math.cos(rot);
    const si=Math.sin(rot);


    /* Glow */

    const g=
        x.createRadialGradient(
            cx,
            cy,
            sc*2,
            cx,
            cy,
            sc*15
        );

    g.addColorStop(
        0,
        "rgba(255,0,20,.09)"
    );

    g.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    x.fillStyle=g;

    x.fillRect(
        0,0,w,h
    );


    /* 3D */

    const arr=points.map(p=>{

        const X=
            p.x*co-
            p.z*si;

        const Z=
            p.x*si+
            p.z*co;

        const persp=
            1/(1+Z/42);

        return{
            p,
            X,
            Z,
            persp
        };

    }).sort(
        (a,b)=>a.Z-b.Z
    );


    /* จุดหัวใจ */

    for(const q of arr){

        const p=q.p;

        const px=
            cx+
            q.X*
            sc*
            .92*
            q.persp;

        const py=
            cy+
            p.y*
            sc*
            .92*
            q.persp;

        const s=Math.max(
            .45,
            p.size*
            q.persp*
            (
                .85+
                .15*
                Math.sin(
                    time*.002+p.tw
                )
            )
        );

        const depth=
            (q.Z+5)/10;

        x.globalAlpha=
            Math.min(
                1,
                p.alpha*
                (.55+.45*depth)
            );

        x.fillStyle=
            `rgb(
                255,
                ${18+Math.floor(35*depth)},
                ${25+Math.floor(35*depth)}
            )`;

        x.beginPath();

        x.arc(
            px,
            py,
            s,
            0,
            TAU
        );

        x.fill();
    }

    x.globalAlpha=1;

    target+=.004;

    requestAnimationFrame(frame);
}


/* =========================
   คลิกเปิดกล่อง
========================= */

const gift=
    document.getElementById("gift");

const giftScreen=
    document.getElementById("giftScreen");

const heart=
    document.getElementById("heart");

let opened=false;

gift.addEventListener(
    "click",
    ()=>{

        if(opened)return;

        opened=true;

        /* เปิดฝากล่อง */

        gift.classList.add("open");


        /* หัวใจพุ่งออกมา */

        setTimeout(()=>{

            heart.classList.add("show");

        },350);


        /* กล่องค่อย ๆ หาย */

        setTimeout(()=>{

            giftScreen.classList.add("hide");

        },900);

    }
);


/* เริ่ม */

addEventListener(
    "resize",
    resize
);

resize();

requestAnimationFrame(frame);

</script>

</body>
</html>
